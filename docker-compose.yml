services:
  postgres:
    image: postgres:15-alpine
    container_name: bughunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bughunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bughunter-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_in_production}
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: bughunter-juice-shop
    restart: unless-stopped
    ports:
      - "3000:3000"

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: bughunter-dvwa
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
