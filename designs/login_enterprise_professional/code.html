<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | BugHunter.AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-variant": "#e0e3e5",
              "on-tertiary-container": "#b08d5b",
              "on-background": "#191c1e",
              "secondary-fixed-dim": "#adc6ff",
              "error": "#ba1a1a",
              "inverse-surface": "#2d3133",
              "outline": "#75777f",
              "surface-container-highest": "#e0e3e5",
              "on-primary-fixed": "#081b3a",
              "on-secondary-fixed-variant": "#004395",
              "secondary-container": "#2170e4",
              "surface-container": "#eceef0",
              "primary-fixed": "#d8e2ff",
              "surface": "#f7f9fb",
              "on-tertiary-fixed-variant": "#5d4217",
              "background": "#f7f9fb",
              "surface-container-high": "#e6e8ea",
              "primary-fixed-dim": "#b6c6ef",
              "on-primary-fixed-variant": "#364768",
              "surface-container-low": "#f2f4f6",
              "on-error-container": "#93000a",
              "tertiary": "#231400",
              "on-primary-container": "#8293b8",
              "surface-tint": "#4e5e81",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#eff1f3",
              "on-error": "#ffffff",
              "inverse-primary": "#b6c6ef",
              "on-secondary-fixed": "#001a42",
              "on-primary": "#ffffff",
              "tertiary-container": "#3e2700",
              "secondary-fixed": "#d8e2ff",
              "on-surface-variant": "#44474e",
              "surface-container-lowest": "#ffffff",
              "primary": "#031635",
              "outline-variant": "#c5c6cf",
              "on-secondary-container": "#fefcff",
              "primary-container": "#1a2b4b",
              "secondary": "#0058be",
              "on-surface": "#191c1e",
              "error-container": "#ffdad6",
              "tertiary-fixed-dim": "#e8c08a",
              "on-tertiary-fixed": "#291800",
              "tertiary-fixed": "#ffddb1",
              "on-secondary": "#ffffff",
              "surface-dim": "#d8dadc",
              "surface-bright": "#f7f9fb"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
      }
      .audit-rail-primary {
        border-left: 3px solid #031635;
      }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col items-center justify-center p-6 selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Subtle Background Elements for Architectural Depth -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary-fixed opacity-10 rounded-full blur-3xl"></div>
<div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-secondary-fixed opacity-5 rounded-full blur-[100px]"></div>
</div>
<!-- Main Container -->
<main class="relative w-full max-w-[440px] z-10">
<!-- Branding Anchor -->
<header class="mb-12 text-center">
<div class="inline-flex items-center gap-3 mb-6">
<div class="w-10 h-10 bg-primary flex items-center justify-center rounded-lg shadow-sm">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<span class="text-2xl font-headline font-bold tracking-tight text-primary">BugHunter.AI</span>
</div>
<h1 class="text-display-sm font-headline font-light tracking-tight text-on-surface">Precision Security Audit</h1>
<p class="text-body-md text-on-surface-variant mt-2 font-normal">Access your enterprise testing environment.</p>
</header>
<!-- Login Card -->
<div class="surface-container-lowest glass-card rounded-xl p-8 lg:p-10 audit-rail-primary">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-label-md font-semibold text-on-surface uppercase tracking-wider block" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/20 rounded-lg text-on-surface placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all duration-200" id="email" name="email" placeholder="name@enterprise.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="text-label-md font-semibold text-on-surface uppercase tracking-wider block" for="password">Password</label>
<a class="text-label-sm font-medium text-secondary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-11 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/20 rounded-lg text-on-surface placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all duration-200" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<div class="pt-2">
<button class="w-full py-4 px-6 bg-gradient-to-br from-primary to-primary-container text-white font-headline font-medium rounded-lg hover:opacity-95 active:scale-[0.98] transition-all duration-200 shadow-sm" type="submit">
                        Sign In
                    </button>
</div>
<!-- Divider -->
<div class="relative py-2">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-label-sm">
<span class="px-4 bg-white text-outline">OR</span>
</div>
</div>
<!-- Secondary Action (SSO) -->
<button class="w-full py-3 px-6 bg-transparent border border-outline-variant/30 text-primary font-body font-medium rounded-lg hover:bg-surface-container-low active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[20px]">hub</span>
                    SSO/SAML Login
                </button>
</form>
</div>
<!-- Footer Meta -->
<footer class="mt-12 text-center text-label-sm text-outline space-y-4">
<p>© 2024 BugHunter.AI. All rights reserved.</p>
<div class="flex justify-center gap-6">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Service Status</a>
<a class="hover:text-primary transition-colors" href="#">Help Center</a>
</div>
</footer>
</main>
<!-- Support Access (Floating Tertiary) -->
<div class="fixed bottom-8 right-8">
<button class="flex items-center gap-2 px-5 py-3 bg-surface-container-lowest border border-outline-variant/20 rounded-full text-on-surface text-label-md font-medium hover:bg-white hover:shadow-lg transition-all duration-300 group">
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform">help_outline</span>
            Support
        </button>
</div>
</body></html>
